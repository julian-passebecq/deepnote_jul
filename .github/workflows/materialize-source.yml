name: Deliver verified Knowledge Atlas V1 source
on:
  push:
    branches: [main]
    paths: ['.bootstrap/SOURCE_READY']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: knowledge-atlas-source-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'julian-passebecq/deepnote_jul'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Verify and unpack exact source snapshot
        run: python3 .bootstrap/unpack.py
      - run: npm ci --ignore-scripts
      - name: Validate source, content and unit tests
        run: npm run check
      - name: Publish readable application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore package.json package-lock.json tsconfig.json README.md LICENSE SECURITY.md THIRD_PARTY_NOTICES.md netlify.toml requirements-e2e.txt src content public scripts tests e2e docs
          git rm -r .bootstrap
          git commit -m 'feat: deliver Knowledge Atlas V1 linked notebook application'
          git push origin HEAD:main
      - name: Install native browser test runner
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-e2e.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Native HTTP and browser-storage acceptance
        run: .venv/bin/python e2e/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: knowledge-atlas-v1-build-and-native-browser-evidence
          path: |
            dist
            test-results
          retention-days: 14
